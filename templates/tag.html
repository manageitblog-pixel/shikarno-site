{% extends "base.html" %}
{% block main %}
<section class="feed tagpage">
  <nav class="crumbs" aria-label="Навігація"><a href="{{ u('/') }}">Новини</a></nav>
  <h1 class="tag-h">{{ tag_title }}</h1>
  <p class="tag-count">{{ items|length }} {{ plural(items|length) }}</p>
  <ol class="rows">{% for p in items %}{% include "_row.html" %}{% endfor %}</ol>
</section>
{% endblock %}
