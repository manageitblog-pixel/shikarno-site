{% macro bait(mood="talk", size=120, cls="") -%}
<svg class="bait {{ cls }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 120 120" role="img" aria-label="Байт, ведучий ШІкарно">
  <defs>
    <linearGradient id="bh-{{ mood }}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#FF4F8B"/></linearGradient>
  </defs>
  <line x1="60" y1="24" x2="60" y2="10" stroke="#FFD60A" stroke-width="4" stroke-linecap="round"/>
  <circle cx="60" cy="9" r="6.5" fill="#FFD60A"/>
  <path d="M14 62a46 46 0 0 1 92 0" fill="none" stroke="#1A1240" stroke-width="5"/>
  <rect x="6" y="52" width="16" height="28" rx="7" fill="#1A1240" stroke="#FF4F8B" stroke-width="3"/>
  <rect x="98" y="52" width="16" height="28" rx="7" fill="#1A1240" stroke="#7C5CFF" stroke-width="3"/>
  <rect x="18" y="24" width="84" height="74" rx="24" fill="url(#bh-{{ mood }})"/>
  <rect x="29" y="38" width="62" height="44" rx="13" fill="#0B0A1C"/>
  {% if mood == "happy" %}
  <path d="M38 61l7-7 7 7M68 61l7-7 7 7" fill="none" stroke="#4CF2FF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M52 69q8 7 16 0" fill="none" stroke="#4CF2FF" stroke-width="3.5" stroke-linecap="round"/>
  {% elif mood == "judge" %}
  <path d="M38 49l13 4M82 49l-13 4" stroke="#FFD60A" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="40" y="56" width="10" height="9" rx="3" fill="#4CF2FF"/><rect x="70" y="56" width="10" height="9" rx="3" fill="#4CF2FF"/>
  <path d="M53 73h14" stroke="#4CF2FF" stroke-width="3.5" stroke-linecap="round"/>
  {% else %}
  <rect x="40" y="50" width="10" height="14" rx="4" fill="#4CF2FF"/><rect x="70" y="50" width="10" height="14" rx="4" fill="#4CF2FF"/>
  <ellipse cx="60" cy="72" rx="6" ry="3.5" fill="#4CF2FF"/>
  {% endif %}
</svg>
{%- endmacro %}

{% macro logo() -%}
<span class="logo" aria-label="ШІкарно"><span class="logo-shi">ШІ</span><span class="logo-rest">карно</span></span>
{%- endmacro %}

{% macro tags(list) -%}
<ul class="tags">{% for t in list %}<li><a href="{{ u('/teg/' ~ t ~ '/') }}">{{ tagname(t) }}</a></li>{% endfor %}</ul>
{%- endmacro %}

{% macro video(p) -%}
<div class="short" data-yt="{{ p.youtube }}">
  <button class="short-play" type="button" aria-label="Дивитись відео «{{ p.title }}»">
    {{ bait("talk", 96) }}
    <span class="short-cap">Дивитись Short</span>
    <span class="short-time">≈45 с</span>
  </button>
  <a class="short-link" href="https://www.youtube.com/shorts/{{ p.youtube }}" rel="noopener">Відкрити на YouTube</a>
</div>
{%- endmacro %}
