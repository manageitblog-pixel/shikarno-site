{% extends "base.html" %}
{% from "macros.html" import bait %}
{% block main %}
<article class="post page">
  <header class="post-head page-head">{{ bait("happy", 120) }}<h1>{{ pg.title }}</h1></header>
  <div class="prose">{{ pg.html|safe }}
    {% if pg.slug == 'spivpratsia' %}<p class="page-links"><a class="btn" href="{{ site.contact }}" rel="noopener">Написати в Telegram</a></p>
    {% else %}<p class="page-links"><a class="btn" href="{{ site.youtube }}" rel="noopener">YouTube</a> <a class="btn btn-alt" href="{{ site.telegram }}" rel="noopener">Telegram</a> <a class="btn btn-alt" href="{{ u('/spivpratsia/') }}">Співпраця</a></p>{% endif %}
  </div>
</article>
{% endblock %}
