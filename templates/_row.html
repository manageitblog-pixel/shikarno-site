<li class="row">
  <a class="row-link" href="{{ u(p.path) }}">
    <time datetime="{{ p.iso }}">{{ p.human }}</time>
    {% if p.label %}<span class="row-kind">{{ p.label }}{% if p.number %} #{{ p.number }}{% endif %}</span>{% endif %}<span class="row-title" style="view-transition-name:t-{{ p.slug }}">{{ p.title }}</span>
    <span class="row-desc">{{ p.description }}</span>
  </a>
  {% if p.youtube %}<span class="row-video">▶ {{ 'Відео' if p.long else 'Short' }}</span>{% endif %}
</li>
