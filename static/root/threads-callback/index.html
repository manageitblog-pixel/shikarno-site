<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Threads — підключення ШІкарно</title>
<style>body{font:16px/1.5 system-ui,sans-serif;background:#0B0A1C;color:#ECEAF8;padding:24px;max-width:560px;margin:auto}code{display:block;word-break:break-all;background:#1A1240;padding:12px;border-radius:8px;margin:12px 0}button{background:#FFD60A;border:0;border-radius:8px;padding:10px 16px;font-weight:700}</style></head>
<body><h1>Підключення Threads</h1><p id="msg">Немає коду в адресі.</p><code id="c" hidden></code><button id="b" hidden>Скопіювати код</button>
<p style="color:#A9A3D6;font-size:14px">Код одноразовий і діє 1 годину. Передай його лише через захищену форму, не в чат. Ця сторінка нічого не зберігає й не надсилає.</p>
<script>var q=new URLSearchParams(location.search),c=q.get('code'),e=q.get('error_description');if(c){c=c.replace(/#_$/,'');document.getElementById('msg').textContent='Готово. Твій код авторизації:';var el=document.getElementById('c');el.textContent=c;el.hidden=false;var b=document.getElementById('b');b.hidden=false;b.onclick=function(){navigator.clipboard&&navigator.clipboard.writeText(c).then(function(){b.textContent='Скопійовано'})}}else if(e){document.getElementById('msg').textContent='Помилка: '+e}</script></body></html>
