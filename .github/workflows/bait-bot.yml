name: Bait bot (Cloudflare Worker)
on:
  push:
    branches: [main]
    paths: ["bait/**", ".github/workflows/bait-bot.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bait
          secrets: |
            BOT_TOKEN
        env:
          BOT_TOKEN: ${{ secrets.BAIT_BOT_TOKEN }}
